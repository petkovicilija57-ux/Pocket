name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Parser smoke tests
        run: |
          mkdir -p /tmp/pocket-tests
          javac -d /tmp/pocket-tests app/src/main/java/co/pocket/companion/NotificationParser.java app/src/test/java/co/pocket/companion/NotificationParserSmokeTest.java
          java -cp /tmp/pocket-tests co.pocket.companion.NotificationParserSmokeTest
      - name: Build and lint
        run: gradle assembleDebug lintDebug --no-daemon
      - name: Lint report
        if: failure()
        run: cat app/build/reports/lint-results-debug.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Pocket-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Pocket-test.apk
          gh release create "test-${{ github.run_number }}" Pocket-test.apk --target "${{ github.sha }}" --prerelease --title "Pocket test build ${{ github.run_number }}" --notes "Test build only. Local registration and notification diagnostics. No live PayPal connection, card provisioning or NFC payments. Not device-tested; not a production wallet."
