name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-preview
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Parser smoke tests
        run: |
          mkdir -p /tmp/pocket-tests
          javac -d /tmp/pocket-tests app/src/main/java/co/pocket/companion/NotificationParser.java app/src/test/java/co/pocket/companion/NotificationParserSmokeTest.java
          java -cp /tmp/pocket-tests co.pocket.companion.NotificationParserSmokeTest
      - name: Build and lint
        run: gradle assembleDebug assembleDebugAndroidTest lintDebug --no-daemon
      - name: Lint report
        if: failure()
        run: cat app/build/reports/lint-results-debug.txt
      - name: Verify install and launch on Android 35
        timeout-minutes: 12
        run: bash scripts/install-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Pocket-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Pocket-0.6.0.apk
          gh release create "tracker-${{ github.run_number }}" Pocket-0.6.0.apk --target "${{ github.sha }}" --prerelease --title "Pocket 0.6.0 - Expense tracker" --notes "Local expense editing, monthly budgets, savings goals, subscription tracking, reports, CSV export and password lock. Tested on Android 35 emulator. Separate app package preserves earlier Pocket data. Development signing: not a production payment wallet. No live NFC payments, card provisioning or PayPal login."
